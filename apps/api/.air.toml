root = "."
tmp_dir = "tmp"

[build]
cmd = "lsof -ti tcp:${PORT:-4000} | xargs -I{} kill -9 {} 2>/dev/null; mkdir -p .gocache && GOCACHE=$(pwd)/.gocache go build -o ./tmp/api ./cmd/server"
entrypoint = "./tmp/api"
full_bin = "./tmp/api"
include_ext = ["go"]
exclude_dir = ["tmp", "dist", "node_modules"]
exclude_regex = ["_test.go"]
stop_on_error = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"
