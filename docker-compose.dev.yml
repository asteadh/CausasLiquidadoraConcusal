services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clc}
      POSTGRES_DB: ${POSTGRES_DB:-clc}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clc} -d ${POSTGRES_DB:-clc}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  dev_postgres_data:
