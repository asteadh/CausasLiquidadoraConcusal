# Template only — never applied via kustomize, never committed with real
# values. Copy this, fill in real values, and `kubectl apply -f` it by hand
# once per cluster (same pattern as nexulex's infra/k8s/omniroute).
apiVersion: v1
kind: Secret
metadata:
  name: causas-secrets
  namespace: causas
type: Opaque
stringData:
  # CNPG bootstrap credentials for the "causas" owner role (postgres-cluster.yaml).
  username: "CHANGE_ME"
  password: "CHANGE_ME"
  # Full connection string apps/api and apps/admin use, built from the same
  # credentials above once the Cluster is up: postgres-rw.causas.svc.cluster.local:5432
  DATABASE_URL: "CHANGE_ME"
  NEXULEX_API_BASE_URL: "https://api.nexulex.com"
  NEXULEX_DEVELOPER_API_KEY: "CHANGE_ME"
  BETTER_AUTH_SECRET: "CHANGE_ME"
  BETTER_AUTH_URL: "https://causas.liquidadoraconcusal.cl"
  CLOUDFLARE_TUNNEL_TOKEN: "CHANGE_ME"
