apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-liquidador
  namespace: causas
  labels:
    app.kubernetes.io/name: sync-liquidador
    app.kubernetes.io/part-of: causas
spec:
  suspend: false
  schedule: "*/15 * * * *"
  timeZone: America/Santiago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sync-liquidador
            app.kubernetes.io/part-of: causas
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync-liquidador
              image: ghcr.io/asteadh/causas-api:latest
              imagePullPolicy: IfNotPresent
              # distroless/static has no shell, so this must be an exec array,
              # not a "sh -c" string — see apps/api/Dockerfile.prod.
              command: ["/app/sync_liquidador"]
              env:
                - name: TZ
                  value: America/Santiago
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: causas-secrets
                      key: DATABASE_URL
                - name: NEXULEX_API_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: causas-secrets
                      key: NEXULEX_API_BASE_URL
                - name: NEXULEX_DEVELOPER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: causas-secrets
                      key: NEXULEX_DEVELOPER_API_KEY
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
